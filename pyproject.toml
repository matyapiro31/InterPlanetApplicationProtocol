[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ipap"
version = "0.1.0"
description = "Reference implementation and simulator of IPAP (Inter-Planet Application Protocol)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "CC0-1.0" }
dependencies = ["pynacl>=1.5"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]
anthropic = ["anthropic"]

[project.scripts]
ipap = "ipap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
